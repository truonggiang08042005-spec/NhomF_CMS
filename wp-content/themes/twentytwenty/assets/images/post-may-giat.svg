<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadowWash" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bgWash)"/>
  <!-- Decorative bubbles -->
  <circle cx="80" cy="50" r="16" fill="#ffffff" opacity="0.25"/>
  <circle cx="120" cy="30" r="8" fill="#ffffff" opacity="0.2"/>
  <circle cx="320" cy="60" r="22" fill="#ffffff" opacity="0.2"/>
  <circle cx="280" cy="40" r="12" fill="#ffffff" opacity="0.25"/>
  
  <!-- Ground -->
  <rect y="215" width="400" height="25" fill="#0369a1"/>

  <!-- Washing machine body -->
  <g filter="url(#shadowWash)" transform="translate(130, 30)">
    <rect x="0" y="0" width="140" height="180" rx="12" fill="#ffffff"/>
    <!-- Top control panel -->
    <rect x="0" y="0" width="140" height="35" rx="12" fill="#f1f5f9"/>
    <!-- Display screen -->
    <rect x="15" y="10" width="45" height="16" rx="3" fill="#0f172a"/>
    <text x="24" y="22" fill="#38bdf8" font-size="10" font-family="Arial, sans-serif" font-weight="bold">10 KG</text>
    <!-- Knob button -->
    <circle cx="80" cy="18" r="8" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <!-- Small buttons -->
    <circle cx="105" cy="18" r="4" fill="#38bdf8"/>
    <circle cx="120" cy="18" r="4" fill="#22c55e"/>
    
    <!-- Door outer circle -->
    <circle cx="70" cy="115" r="50" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Door glass -->
    <circle cx="70" cy="115" r="40" fill="#0284c7" opacity="0.85"/>
    <ellipse cx="60" cy="105" rx="20" ry="12" fill="#ffffff" opacity="0.4" transform="rotate(-30 60 105)"/>
    <!-- Drum texture -->
    <circle cx="70" cy="115" r="25" fill="none" stroke="#ffffff" stroke-dasharray="4 4" stroke-width="2" opacity="0.5"/>
    <!-- Bottom drawer -->
    <line x1="15" y1="172" x2="45" y2="172" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
