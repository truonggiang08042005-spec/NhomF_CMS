<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWatch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <filter id="shadowWatch" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bgWatch)"/>
  
  <g filter="url(#shadowWatch)" transform="translate(130, 20)">
    <!-- Watch Strap Top -->
    <path d="M45 0 L95 0 L90 55 L50 55 Z" fill="#3b82f6"/>
    <!-- Watch Strap Bottom -->
    <path d="M50 145 L90 145 L95 200 L45 200 Z" fill="#3b82f6"/>
    <!-- Strap stitch lines -->
    <line x1="52" y1="5" x2="55" y2="50" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="88" y1="5" x2="85" y2="50" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="55" y1="150" x2="52" y2="195" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="85" y1="150" x2="88" y2="195" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Watch Case Crown (Button) -->
    <rect x="122" y="93" width="7" height="14" rx="2" fill="#94a3b8"/>
    
    <!-- Watch Outer Case -->
    <circle cx="70" cy="100" r="54" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    <!-- Watch Bezel -->
    <circle cx="70" cy="100" r="48" fill="#1e293b"/>
    <!-- Watch Dial -->
    <circle cx="70" cy="100" r="44" fill="url(#dialGrad)"/>

    <!-- Hour Markers -->
    <line x1="70" y1="60" x2="70" y2="67" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="140" x2="70" y2="133" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="100" x2="37" y2="100" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="100" x2="103" y2="100" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

    <!-- Watch Brand Text -->
    <text x="70" y="83" font-size="6" font-weight="bold" fill="#64748b" text-anchor="middle" font-family="Arial">CHRONO</text>

    <!-- Watch Hands -->
    <!-- Hour Hand -->
    <line x1="70" y1="100" x2="52" y2="90" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute Hand -->
    <line x1="70" y1="100" x2="86" y2="76" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Second Hand -->
    <line x1="70" y1="105" x2="70" y2="65" stroke="#ef4444" stroke-width="1.2"/>
    <!-- Center Pin -->
    <circle cx="70" cy="100" r="3" fill="#ef4444"/>
  </g>
</svg>
