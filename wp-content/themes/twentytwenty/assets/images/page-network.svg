<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="serverWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background Datacenter Room -->
  <rect width="400" height="240" fill="url(#serverWall)"/>
  
  <!-- Ceiling & Floor Perspective -->
  <polygon points="0,200 400,170 400,240 0,240" fill="url(#floorGrad)"/>
  <polygon points="0,0 400,0 400,40 0,50" fill="#0f172a"/>

  <!-- Server Racks Row with Perspective -->
  <!-- Rack 1 (Far Right) -->
  <rect x="290" y="45" width="85" height="135" fill="#18202f" stroke="#334155" stroke-width="2"/>
  <g fill="#0284c7">
    <circle cx="300" cy="55" r="1.5"/><circle cx="305" cy="55" r="1.5"/><circle cx="310" cy="55" r="1.5"/>
    <circle cx="300" cy="68" r="1.5"/><circle cx="305" cy="68" r="1.5"/>
  </g>

  <!-- Rack 2 (Middle Right) -->
  <rect x="210" y="40" width="85" height="145" fill="#141c2b" stroke="#334155" stroke-width="2"/>
  <!-- Trays -->
  <g stroke="#334155" stroke-width="1">
    <line x1="210" y1="55" x2="295" y2="55"/>
    <line x1="210" y1="70" x2="295" y2="70"/>
    <line x1="210" y1="85" x2="295" y2="85"/>
    <line x1="210" y1="100" x2="295" y2="100"/>
    <line x1="210" y1="115" x2="295" y2="115"/>
    <line x1="210" y1="130" x2="295" y2="130"/>
    <line x1="210" y1="145" x2="295" y2="145"/>
    <line x1="210" y1="160" x2="295" y2="160"/>
  </g>
  <!-- LEDs -->
  <circle cx="220" cy="48" r="2" fill="#22c55e"/>
  <circle cx="226" cy="48" r="2" fill="#38bdf8"/>
  <circle cx="232" cy="48" r="2" fill="#22c55e"/>
  <circle cx="220" cy="63" r="2" fill="#eab308"/>
  <circle cx="226" cy="63" r="2" fill="#38bdf8"/>
  <circle cx="220" cy="78" r="2" fill="#22c55e"/>
  <circle cx="226" cy="78" r="2" fill="#22c55e"/>

  <!-- Rack 3 (Front Left - Prominent) -->
  <rect x="15" y="30" width="190" height="175" fill="#0b1120" stroke="#475569" stroke-width="2.5"/>
  <!-- Front Server Trays -->
  <g stroke="#334155" stroke-width="1.5">
    <line x1="15" y1="50" x2="205" y2="50"/>
    <line x1="15" y1="70" x2="205" y2="70"/>
    <line x1="15" y1="90" x2="205" y2="90"/>
    <line x1="15" y1="110" x2="205" y2="110"/>
    <line x1="15" y1="130" x2="205" y2="130"/>
    <line x1="15" y1="150" x2="205" y2="150"/>
    <line x1="15" y1="170" x2="205" y2="170"/>
    <line x1="15" y1="190" x2="205" y2="190"/>
  </g>
  <!-- Server Unit details & vents -->
  <g fill="#1e293b">
    <rect x="30" y="36" width="90" height="9" rx="1"/>
    <rect x="30" y="56" width="90" height="9" rx="1"/>
    <rect x="30" y="76" width="90" height="9" rx="1"/>
    <rect x="30" y="96" width="90" height="9" rx="1"/>
    <rect x="30" y="116" width="90" height="9" rx="1"/>
    <rect x="30" y="136" width="90" height="9" rx="1"/>
    <rect x="30" y="156" width="90" height="9" rx="1"/>
    <rect x="30" y="176" width="90" height="9" rx="1"/>
  </g>
  <!-- Glowing Cable Bundles (Blue and Orange cables) -->
  <path d="M130,40 Q150,80 135,120 Q120,160 140,200" fill="none" stroke="#0284c7" stroke-width="3" opacity="0.85"/>
  <path d="M135,40 Q155,80 140,120 Q125,160 145,200" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
  <path d="M142,40 Q160,80 146,120 Q132,160 152,200" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.85"/>
  <!-- Front Glowing LEDs -->
  <g>
    <circle cx="170" cy="40" r="2.5" fill="#22c55e"/><circle cx="178" cy="40" r="2.5" fill="#38bdf8"/><circle cx="186" cy="40" r="2.5" fill="#22c55e"/>
    <circle cx="170" cy="60" r="2.5" fill="#38bdf8"/><circle cx="178" cy="60" r="2.5" fill="#38bdf8"/><circle cx="186" cy="60" r="2.5" fill="#eab308"/>
    <circle cx="170" cy="80" r="2.5" fill="#22c55e"/><circle cx="178" cy="80" r="2.5" fill="#22c55e"/><circle cx="186" cy="80" r="2.5" fill="#38bdf8"/>
    <circle cx="170" cy="100" r="2.5" fill="#38bdf8"/><circle cx="178" cy="100" r="2.5" fill="#22c55e"/><circle cx="186" cy="100" r="2.5" fill="#22c55e"/>
    <circle cx="170" cy="120" r="2.5" fill="#22c55e"/><circle cx="178" cy="120" r="2.5" fill="#38bdf8"/><circle cx="186" cy="120" r="2.5" fill="#eab308"/>
    <circle cx="170" cy="140" r="2.5" fill="#38bdf8"/><circle cx="178" cy="140" r="2.5" fill="#22c55e"/><circle cx="186" cy="140" r="2.5" fill="#22c55e"/>
    <circle cx="170" cy="160" r="2.5" fill="#22c55e"/><circle cx="178" cy="160" r="2.5" fill="#38bdf8"/><circle cx="186" cy="160" r="2.5" fill="#38bdf8"/>
    <circle cx="170" cy="180" r="2.5" fill="#22c55e"/><circle cx="178" cy="180" r="2.5" fill="#22c55e"/><circle cx="186" cy="180" r="2.5" fill="#22c55e"/>
  </g>
</svg>
