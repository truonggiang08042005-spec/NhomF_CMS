<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <filter id="dsShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Desktop Surface -->
  <rect width="400" height="240" fill="#f1f5f9"/>

  <!-- Left Card: Student / Education Icon on paper -->
  <g filter="url(#dsShadow)">
    <rect x="35" y="40" width="100" height="150" rx="3" fill="#ffffff"/>
    <!-- Student Mortarboard Icon -->
    <path d="M85,75 L55,90 L85,105 L115,90 Z" fill="#1e293b"/>
    <path d="M68,98 L68,115 C68,125 102,125 102,115 L102,98" fill="#1e293b"/>
    <!-- Tassel -->
    <path d="M105,96 L108,115" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="108" cy="117" r="2.5" fill="#f59e0b"/>
    <!-- Person shoulders -->
    <path d="M60,150 C60,132 110,132 110,150 Z" fill="#f59e0b"/>
    <!-- Fake text lines on paper -->
    <line x1="50" y1="168" x2="120" y2="168" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="178" x2="105" y2="178" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Top Right: Graphic Design Workspace Monitor -->
  <g filter="url(#dsShadow)">
    <rect x="180" y="30" width="180" height="115" rx="4" fill="#ffffff"/>
    <rect x="185" y="35" width="170" height="105" fill="#f8fafc"/>
    <!-- Colorful vector graphic on screen -->
    <polygon points="200,120 235,55 270,120" fill="#f97316"/>
    <polygon points="245,120 280,75 315,120" fill="#ef4444" opacity="0.85"/>
    <polygon points="280,120 310,90 340,120" fill="#0284c7" opacity="0.9"/>
    <!-- Graphic UI pallets on screen -->
    <rect x="192" y="42" width="18" height="18" rx="2" fill="#ef4444"/>
    <rect x="214" y="42" width="18" height="18" rx="2" fill="#22c55e"/>
    <rect x="236" y="42" width="18" height="18" rx="2" fill="#38bdf8"/>
  </g>

  <!-- Tools & Accessories -->
  <!-- Triangle Ruler (Orange) -->
  <polygon points="150,130 190,50 190,130" fill="#f97316" opacity="0.85" filter="url(#dsShadow)"/>
  <polygon points="163,120 182,82 182,120" fill="#f1f5f9"/>

  <!-- Headphones on Bottom Left -->
  <g filter="url(#dsShadow)">
    <path d="M150,185 C150,160 190,160 190,185" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <rect x="145" y="180" width="10" height="20" rx="4" fill="#0f172a"/>
    <rect x="185" y="180" width="10" height="20" rx="4" fill="#0f172a"/>
  </g>

  <!-- Keyboard on Bottom Right -->
  <g filter="url(#dsShadow)">
    <rect x="220" y="160" width="135" height="48" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Keys -->
    <g fill="#e2e8f0">
      <rect x="226" y="166" width="8" height="6" rx="1"/><rect x="237" y="166" width="8" height="6" rx="1"/><rect x="248" y="166" width="8" height="6" rx="1"/><rect x="259" y="166" width="8" height="6" rx="1"/><rect x="270" y="166" width="8" height="6" rx="1"/><rect x="281" y="166" width="8" height="6" rx="1"/><rect x="292" y="166" width="8" height="6" rx="1"/><rect x="303" y="166" width="8" height="6" rx="1"/><rect x="314" y="166" width="8" height="6" rx="1"/><rect x="325" y="166" width="15" height="6" rx="1"/>
      <rect x="226" y="175" width="12" height="6" rx="1"/><rect x="241" y="175" width="8" height="6" rx="1"/><rect x="252" y="175" width="8" height="6" rx="1"/><rect x="263" y="175" width="8" height="6" rx="1"/><rect x="274" y="175" width="8" height="6" rx="1"/><rect x="285" y="175" width="8" height="6" rx="1"/><rect x="296" y="175" width="8" height="6" rx="1"/><rect x="307" y="175" width="8" height="6" rx="1"/><rect x="318" y="175" width="8" height="6" rx="1"/><rect x="329" y="175" width="15" height="6" rx="1"/>
      <rect x="250" y="193" width="55" height="6" rx="1" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- Color Swatch / Pencils / Palette -->
  <g filter="url(#dsShadow)">
    <rect x="320" y="30" width="22" height="25" fill="#ef4444" rx="2"/>
    <circle cx="340" cy="80" r="10" fill="#f59e0b"/>
  </g>
</svg>
