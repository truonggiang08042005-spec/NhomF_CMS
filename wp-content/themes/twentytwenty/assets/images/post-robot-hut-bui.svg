<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRobot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowRobot" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bgRobot)"/>
  
  <!-- Floor perspective grid -->
  <line x1="0" y1="210" x2="400" y2="210" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
  <line x1="40" y1="240" x2="160" y2="170" stroke="#475569" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="240" x2="200" y2="170" stroke="#475569" stroke-width="1" opacity="0.4"/>
  <line x1="360" y1="240" x2="240" y2="170" stroke="#475569" stroke-width="1" opacity="0.4"/>

  <!-- Dock Station in background -->
  <g transform="translate(145, 40)">
    <rect x="0" y="0" width="110" height="110" rx="8" fill="#f8fafc"/>
    <rect x="15" y="15" width="80" height="35" rx="4" fill="#e2e8f0"/>
    <line x1="55" y1="25" x2="55" y2="40" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="55" cy="8" r="3" fill="#38bdf8"/>
    <!-- Base ramp -->
    <path d="M-10 110 L120 110 L105 130 L5 130 Z" fill="#cbd5e1"/>
  </g>

  <!-- Robot Body in foreground -->
  <g filter="url(#shadowRobot)" transform="translate(130, 110)">
    <!-- Shadow ellipse -->
    <ellipse cx="70" cy="85" rx="72" ry="24" fill="#0f172a" opacity="0.5"/>
    <!-- Main disc body -->
    <ellipse cx="70" cy="65" rx="68" ry="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Inner concentric ring -->
    <ellipse cx="70" cy="63" rx="55" ry="24" fill="#f1f5f9"/>
    <!-- LiDAR Sensor turret -->
    <ellipse cx="70" cy="52" rx="20" ry="10" fill="#0284c7"/>
    <ellipse cx="70" cy="49" rx="16" ry="7" fill="#38bdf8"/>
    <!-- Power button -->
    <circle cx="70" cy="72" r="5" fill="#22c55e"/>
    <!-- Front bumper line -->
    <path d="M12 60 A60 28 0 0 0 128 60" fill="none" stroke="#94a3b8" stroke-width="2"/>
  </g>
</svg>
